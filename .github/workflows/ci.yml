name: FinEmi Marketplace CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Build & Vitest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Generate Prisma Client
        run: cd backend && npx prisma generate

      - name: Build Backend TypeScript
        run: cd backend && npm run build

      - name: Run Backend Vitest Suite
        run: cd backend && npm test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/fineemi_db?schema=public"
          JWT_SECRET: "ci_jwt_secret_key_testing_1fi_2026"

  frontend:
    name: Frontend Build & Vitest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Build Frontend Production Bundle
        run: cd frontend && npm run build

      - name: Run Frontend Vitest Suite
        run: cd frontend && npm test
